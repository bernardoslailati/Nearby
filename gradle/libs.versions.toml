[versions]
agp = "8.6.1"
coilNetworkOkhttp = "3.0.0-rc01"
kotlin = "2.0.20"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
kotlinxSerializationJson = "1.7.3"
ktorBom = "3.0.0"
